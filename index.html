<!-- 这个文件是「源码入口」，只给 npm run dev 用；构建后的成品在 dist/。
     双击打开时模块脚本加载不了，页面会全白 —— 等一会儿还没挂上内容就给一句人话。 -->
<div id="boot-hint" hidden style="max-width:520px;margin:18vh auto;padding:0 24px;font:15px/1.9 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#DCD6EA">
  <h1 style="font-size:20px;margin:0 0 12px">这是源码入口，不能直接打开</h1>
  <p style="margin:0 0 14px;color:#9C93B8">它需要构建后才能运行。三个办法：</p>
  <ol style="margin:0;padding-left:1.4em;color:#9C93B8">
    <li style="margin-bottom:8px"><b style="color:#DCD6EA">只想用</b>：直接访问部署好的网址</li>
    <li style="margin-bottom:8px"><b style="color:#DCD6EA">要离线单文件</b>：<code>npm install &amp;&amp; npm run build:single</code>，产物在 dist-single/index.html</li>
    <li><b style="color:#DCD6EA">要开发</b>：<code>npm install &amp;&amp; npm run dev</code>，打开 localhost:5183</li>
  </ol>
</div>
<script>
  // 只有在本地直接打开（file://）且 1.2 秒后 #app 还是空的才提示 ——
  // 线上跑的是构建产物，这段永远不会出现。
  setTimeout(function () {
    var app = document.getElementById('app');
    if (location.protocol === 'file:' && app && app.childElementCount === 0) {
      document.getElementById('boot-hint').hidden = false;
    }
  }, 1200);
</script>

<script type="module" src="/src/app/main.ts"></script>
